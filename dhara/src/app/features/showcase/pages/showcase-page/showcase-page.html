<h1>DHUI Components</h1>

<h2>Buttons</h2>

<div class="button-row">

    <dh-button>Primary</dh-button>

    <dh-button variant="secondary">

        Secondary

    </dh-button>

    <dh-button variant="outline">

        Outline

    </dh-button>

    <dh-button variant="ghost">

        Ghost

        </dh-button>

        <dh-button variant="success">

            Success

        </dh-button>

        <dh-button variant="danger">

            Danger

        </dh-button>

        <dh-button [loading]="true">

            Save

        </dh-button>
        <hr>

        <h2>Inputs</h2>

        <dh-input label="Product Name" placeholder="Enter product">
        </dh-input>

        <hr>

        <h2>Cards</h2>

        <dh-card title="Today's Sales">

            ₹ 45,820

        </dh-card>

        <hr>

        <h2>Badges</h2>

        <dh-badge text="Active">
        </dh-badge>
</div>
